# One place for every setting. Change things here, not in the code.
# The corpora: settings pick the data folders automatically (a different subset or size gets
# its own folder). Settings that change how an INDEX is built (embedding model, chunk sizes,
# ...) do NOT: after changing one, delete that RAG's folder in indexes/ so it is rebuilt.
# README.md (section 4.9) lists exactly which settings need what.

llm:
  # Current model name per DeepSeek's changelog (2026-09-10).
  model: deepseek-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  thinking: disabled
  temperature: 0.0
  cache: true                     # cache the deterministic calls (judge, mutation checks: those that ask for temperature 0). A repeated, resumed or --fresh run does not pay for them again; RAG answers and all text-writing calls are never cached (README 14.11)
  cache_path: results/llm_cache.sqlite

embedding:
  # DeepSeek has no embedding API, so embeddings run locally.
  # Used by LightRAG and RAPTOR. (MedRAG uses its own medical retriever, MedCPT.)
  model: BAAI/bge-small-en-v1.5

corpora:
  lightrag:
    subset: mix          # UltraDomain subset: mix | agriculture | cs | legal (the four used in the LightRAG paper)
    max_docs: 10         # null = use every document (slow and costly on the big subsets)
  raptor:
    split: dev           # QuALITY split: dev | train
    max_docs: 10         # null = all
  medrag:
    max_textbooks: 3     # how many of the 18 MedRAG textbooks to use; null = all 18

lightrag:
  query_mode: hybrid
  # Smaller than LightRAG's default 1200 so chunks fit the embedding model's
  # 512-token window. A deviation from the paper's setup: disclose it.
  chunk_token_size: 400
  chunk_overlap_token_size: 50

raptor:
  repo_dir: third_party/raptor   # RAPTOR's own code, cloned by prepare_corpora.py
  chunk_tokens: 100              # RAPTOR default
  num_layers: 5                  # RAPTOR default
  summary_tokens: 100            # RAPTOR default
  top_k: 10                      # RAPTOR default
  max_context_tokens: 3500       # RAPTOR default

medrag:
  top_k: 32                      # MedRAG's default number of retrieved snippets
  batch_size: 32                 # snippets embedded at a time when building the index
  refusal_instruction: true      # add to the system prompt: if the documents lack the information, answer exactly the refusal phrase (README 14.10). false = the original MedRAG prompt
  refusal_phrase: "Cannot be answered from given information."   # the judge and all counts look for exactly this answer (the `refused` column)

# Question used by scripts/test_rag.py (you can also pass your own with --question)
tests:
  lightrag: "What are the main topics covered in these documents?"
  raptor: "What happens in the first story?"
  medrag: "What is the function of the phrenic nerve?"

# ------------------------------------------------------------------------
# Benchmark generation (RAGAS / ARES / DataMorgana). Every knob is here.
# ------------------------------------------------------------------------
benchmark:
  seed: 42                        # same seed + same settings = same passages picked
  output_dir: results/benchmarks

  # HOW MANY questions. Two ways to say it:
  #   mode: ratio  -> questions_per_1k_words x (corpus size in words / 1000), kept between min and max
  #   mode: count  -> exactly `count` questions
  size:
    mode: ratio
    questions_per_1k_words: 2.0
    count: 100
    min_questions: 20
    max_questions: 300

  # Size of the text unit a question is generated from, per method (in words).
  # Defaults are guesses from the papers: RAGAS used Wikipedia intro sections, ARES used short
  # KILT-style passages, DataMorgana used whole documents (here capped to one passage).
  passage_words:
    ragas: 250
    ares: 100
    datamorgana: 300
  min_passage_words: 40           # drops tiny leftover fragments at the end of a document

  sampling: spread                # spread = take turns between documents | random | sequential
  max_questions_per_passage: 1    # 1 = every question comes from a different passage
  max_attempts_factor: 3          # give up after target x this many attempts (filters reject some)
  concurrency: 8                  # LLM calls in parallel (lower it if DeepSeek rate-limits you)
  temperature: 0.0                # 0 = repeatable; raise for more varied questions
  dedupe_threshold: 0.9           # drop a question whose meaning is this close (cosine) to an earlier one; null = off
  drop_context_references: true   # drop questions saying "in the passage / given context" (not in the papers)

  ragas: {}                       # the RAGAs paper's question prompt has no settings

  ares:
    fewshot:                      # in-domain examples; replace with examples from YOUR corpus if you can
      lightrag: configs/ares_fewshot_general.json
      raptor: configs/ares_fewshot_general.json
      medrag: configs/ares_fewshot_medical.json
    n_fewshot: 5
    roundtrip_filter: true        # keep a query only if it retrieves its own passage
    roundtrip_top_k: 1            # the paper requires rank 1; raise to be more lenient
    negatives: false              # also make the paper's negatives for judge training (1 extra LLM call each)

  datamorgana:
    categorizations:              # who asks, and what kinds of questions (edit these JSON files freely)
      lightrag: configs/datamorgana_general.json
      raptor: configs/datamorgana_general.json
      medrag: configs/datamorgana_medical.json
    candidates_per_call: 3        # k in the paper
    filter: true                  # the paper's quality filter (1 extra LLM call per attempt)

# ------------------------------------------------------------------------
# Real user queries, for comparison with our generated benchmarks.
# ------------------------------------------------------------------------
real_queries:
  output_dir: data/real_queries
  spacy_model: en_core_web_sm       # small + fast; en_core_web_trf is more accurate but much slower
  streaming: true                   # true = read WildChat / LMSYS-Chat over the network without saving them (nothing big on disk,
                                    #        but EVERY run re-reads the whole dataset). false = download once into the Hugging Face
                                    #        cache (several GB on disk, check the dataset pages) and reuse it: better if you will run
                                    #        this more than once (the medical set, a fresh held-out sample, another seed).

  general:
    # First user turn only, from two large real-world chat logs. Both need a
    # Hugging Face account that has requested and been granted access on the
    # dataset's page, and a token in .env as HF_TOKEN (see README section 11).
    sources: [wildchat, lmsyschat]
    n_per_source: 2000     # how many conversations to sample from EACH source
    languages: [en]        # keep only these detected/declared languages; null = keep all
    min_words: 3           # drop near-empty turns ("hi", "ok")
    max_words: 200         # drop unusually long pastes (code dumps, whole documents)
    seed: 42

  medical:
    # HealthChat-11K: the flagged health-seeking turn from each conversation,
    # pulled from the same two source datasets using HealthChat's own annotation file.
    n: 2000                 # null = use all ~11,000
    min_words: 3
    max_words: 200
    seed: 42

# ------------------------------------------------------------------------
# Comparing question sets (real queries vs. generated benchmarks).
# ------------------------------------------------------------------------
analysis:
  output_dir: results/analysis
  classifier_test_size: 0.3   # fraction of each set held out to test the real-vs-generated classifier
  classifier_cv_folds: 5      # cross-validation folds on the training part (reported alongside the held-out score)
  seed: 42
  bootstrap_samples: 2000     # for confidence intervals on each feature's difference

# ------------------------------------------------------------------------
# Mutations: turn generated benchmark questions into Benchmark+ questions.
# README section 13 explains every operator and the guarantees behind it.
# ------------------------------------------------------------------------
mutation:
  output_dir: results/mutations   # holds mutation1_length/, mutation2_linguistic/, mutation3_userinfo/, mutation123_combined/
  seed: 42
  temperature: 0.3                # LLM randomness when WRITING mutation text (checks always use 0)
  concurrency: 8                  # items processed in parallel
  max_retries: 2                  # a mutation that fails its check is redone up to this many extra times, then dropped
  fill_all: true                  # one version of each mutation for EVERY question: a mutation that fails its checks is replaced by a fallback (Elaborate: a template instruction, Colloquial: one rule-based operator, Premise: more tries) instead of being dropped, and earlier questions with a missing mutation are filled in when you run the step again. Fallbacks are marked in the row's meta and counted in the report. false = drop failures (README 13.12)
  max_items_per_file: null        # cap items per (rag, method); null = all. (--limit on the command line does the same)
  generate_combined: false        # true = also create the m123 questions (all three mutations in one prompt); only needed with evaluation.combined: run

  # Mutation 1: make the prompt LONGER without changing what is asked or the answer.
  length:
    n_ops: 2                      # how many different length operators are applied to each question
    operators:                    # relative sampling weight of each operator; 0 switches one off
      restate: 1.0                # add a restatement of the question in other words
      background: 1.0             # add one background sentence taken from the passage (never the answer)
      instruction: 1.0            # add a content-free answer-style instruction (template, no LLM)
      appositive: 1.0             # add a short passage-based description after one term in the question
    verify: true                  # LLM check that the question still asks the same thing and the answer still holds
    target:                       # how long the mutated prompt should be
      mode: real                  # none = every question gets n_ops operators (long prompts) | real = each question draws a target length from the word counts of REAL user queries of its domain, and operators are added one at a time until it is reached | range = uniform in `range`
      range: [25, 80]             # used by mode range
      cap_words: 100              # mode real: ignore real queries longer than this
      max_ops: 3                  # at most this many operators per question
      slack: 1.4                  # an operator that would push the prompt past target x slack is skipped

  # Mutation 2: change HOW the prompt is written (typos, register, person), not what it says.
  linguistic:
    n_ops: 2                      # how many different linguistic operators are applied to each question
    operators:
      typos: 1.0                  # character-level typos (distance 1) in a few words
      casual: 1.0                 # contractions, informal wording, lowercase start, dropped punctuation, filler
      first_person: 0.7           # generic third-person subject -> "I"; else a first-person lead-in sentence
      politeness: 0.5             # a polite lead-in or closing (lower weight: real queries are polite ~11% of the time)
      imperative: 1.0             # "What is X?" -> "Tell me what is X." (real queries often start with a verb)
      synonyms: 1.0               # a few words swapped for WordNet synonyms ("decrease" -> "minify"), checked by a similarity gate
    typo_rate: 0.15               # fraction of eligible words that get a typo
    min_typos: 1                  # at least this many typos (if any word is eligible)
    max_typos: 3                  # at most this many typos
    min_word_len: 5               # only words at least this long can get a typo
    protect_entities: false       # true = never put a typo inside a named entity
    casual_lowercase_prob: 0.8    # casual: chance of lowercasing the first letter
    casual_drop_punct_prob: 0.7   # casual: chance of dropping the final ? or .
    casual_elongate_prob: 0.15    # casual: chance of stretching the final punctuation instead ("?" -> "???")
    casual_filler_prob: 0.4       # casual: chance of a filler opener such as "ok so"
    synonym_pos: [VERB, ADJ, ADV] # synonyms: which kinds of words may be replaced (add NOUN for nouns: riskier for technical terms)
    synonym_max_words: 2          # synonyms: at most this many words replaced per question (never two neighbours)
    synonym_min_similarity: 0.9   # synonyms: keep a swap only if the sentence embedding stays this similar (cosine) to the original
    synonym_llm_check: true       # synonyms: an LLM approves each swap IN CONTEXT (1 call per question that uses the operator). false = similarity gate only: it lets wrong-sense swaps through
    synonym_choice: random        # synonyms: which passing synonym to use: random | rarest (like "minify") | commonest
    verify: true                  # rule-based check that numbers and negations are untouched

  # Mutation 3: add information the USER states: correct (answer stays) or incorrect (answer changes).
  userinfo:
    p_correct: 0.5                # fraction of questions that get CORRECT user information (the rest get incorrect)
    correct_operators:
      true_premise: 1.0           # the user states a true fact from the passage (not the answer)
      correct_candidate: 1.0      # the user offers the correct answer and asks to confirm
      patient_consistent: 0.0     # MEDICAL: the user first states a patient profile the passage's answer still applies to (answer unchanged). 0 = off here; the paper and pilot profiles switch it on (README 13.13)
    incorrect_operators:
      false_premise: 1.0          # the user states a false fact that contradicts the passage
      wrong_candidate: 1.0        # the user offers a wrong answer and asks to confirm
      unsupported_assumption: 1.0 # the user adds a detail the passage never mentions (the question cannot be settled)
      patient_conflict: 0.0       # MEDICAL: the user first states a patient profile that conflicts with the question/passage (another age group, pregnancy, contraindication...): the expected answer is "Cannot be answered from given information." 0 = off here; on in the paper and pilot profiles
    verify: true                  # LLM check that each claim is entailed / contradicted / not mentioned as intended
    naturalize: true              # an LLM rewrites the added sentence in a natural voice (rule-checked: the claim's words and numbers must survive, else the template sentence is kept); 1 extra call per question

# ------------------------------------------------------------------------
# Running benchmarks and mutated benchmarks on the RAGs.
# README section 14 explains the metrics.
# ------------------------------------------------------------------------
evaluation:
  output_dir: results/eval
  conditions: [baseline, m1, m2, m3, c_rerun, c_pad]   # baseline = original benchmark; m1/m2/m3 = the original question with ONLY that mutation; c_rerun, c_pad = CONTROLS (not mutations): the same benchmark question answered again, and the question + off-topic filler as long as the M1 version. Remove the controls to save about 30% of the cost.
  combined: derived               # derived = the combined "M1+M2+M3" number is computed from the separate m1, m2, m3 runs (a question fails if it fails in the benchmark or in any of the three; nothing extra is run). run = also run m123, the three mutations applied to ONE prompt (needs mutation.generate_combined: true and costs a fifth of the evaluation)
  sample_per_file: 500            # questions per (rag, method) evaluated in EVERY condition; null = all. Same questions in all conditions.
  seed: 42                        # which questions are sampled
  batch_size: 32                  # questions answered between saves (an interrupted run resumes at the last save)
  rag_concurrency:                # questions a RAG answers at once
    lightrag: 8
    raptor: 4
    medrag: 8
  judge_concurrency: 8            # judge calls in parallel
  judge_llm:                      # the JUDGE is a different model than the one inside the RAGs (llm: = DeepSeek generates, this one judges), so a model never grades its own answers. null = judge with llm: (README 14.12)
    model: gpt-6-luna             # OpenAI's cheapest current model. Put OPENAI_API_KEY=... in the .env file
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    thinking: null                # null = do not send DeepSeek's "thinking" field to OpenAI
    reasoning_effort: none        # GPT-6 reasons by default (billed as output tokens); none = answer directly, cheap and fast
    token_param: max_completion_tokens   # OpenAI's name for the output limit
    min_output_tokens: 1500       # every judge call may write at least this much (room in case the model reasons anyway)
    send_temperature: true        # temperature 0 is sent; if the API refuses it, the call is repeated without it automatically
  faithfulness_threshold: 1.0     # an answer is UNFAITHFUL if its faithfulness score is below this (1.0 = any unsupported statement)
  max_context_chars: 60000        # retrieved context given to the faithfulness judge is cut at this length
  user_message_as_context: true   # a statement that only repeats what the USER said counts as supported (adopting a false claim is caught by the behaviour label). false = plain faithfulness against the retrieved context
  also_strict_faithfulness: true  # also keep the plain score (faithfulness_strict, hallucinated_strict): 1 extra judge call per answer, so both versions can be reported
  skip_redundant_verdicts: true   # the strict faithfulness check goes first; if it finds every statement supported, the check WITH the user message (which can only add support) is not asked: 1 judge call less for every faithful answer. false = always ask both
  also_source_faithfulness: false # also score faithfulness against ORIGINAL source text only (1 extra judge call per answer)
  store_contexts: false           # true = keep the retrieved contexts in every result row (large files)
  bootstrap_samples: 2000         # resamples for confidence intervals in the analysis

# ------------------------------------------------------------------------
# Benchmark database (named entities + graph templates), the union of the benchmark methods, and the paper report.
# README sections 29 to 33.
# ------------------------------------------------------------------------
benchdb:
  dir: results/benchdb            # where <name>.benchmark databases are written
  spacy_model: null               # null = real_queries.spacy_model. A biomedical model (e.g. scispaCy en_core_sci_md) finds medical entities that en_core_web_sm misses
  concepts: true                  # also store noun phrases that are not named entities, as entities of type CONCEPT
  passage_entities: true          # also store the entities of the source passages (once per passage)
  answer_chars: 1200              # an answer is cut at this length before it is analysed

union:
  dedupe_threshold: 0.9           # union of the benchmark methods: drop a question whose embedding cosine similarity to one already kept is at least this (null = keep all)

paper:
  output_dir: results/paper       # paper_report.py / paper_examples.py write here
  max_per_set: 5000               # sets larger than this are sampled (once, seeded) for the classifier and template statistics
  audit_n: 100                    # mutated questions per mutation in the hand-audit sheet
  seed: 42

# ------------------------------------------------------------------------
# Profiles: sets of overrides merged on top of everything above.
# Use with BP_PROFILE=large, or scripts/run_all.py --profile large.
# ------------------------------------------------------------------------
profiles:
  large:
    # Bigger corpora (so there are enough passages) and thousands of questions per RAG x method.
    # NOTE: a bigger corpus means a different corpus folder and a NEW index, which costs LLM calls
    # for LightRAG and RAPTOR. Use `python scripts/run_all.py --profile large --dry-run` to see the plan.
    corpora:
      lightrag: {max_docs: 30}
      raptor: {max_docs: 40}
      medrag: {max_textbooks: 3}
    benchmark:
      output_dir: results/benchmarks_large
      size: {mode: count, count: 2000}   # change the number here, or with --n on the command line
      max_questions_per_passage: 4       # several questions per passage, so a modest corpus still gives thousands
      max_attempts_factor: 4
      temperature: 0.7                   # >0 so several questions from one passage differ
      concurrency: 16                    # lower this if DeepSeek returns rate-limit errors
    mutation:
      output_dir: results/mutations_large
    evaluation:
      output_dir: results/eval_large
    analysis:
      output_dir: results/analysis_large

  paper:
    # The profile for the paper: 10,000 questions per RAG x method. The bigger corpora below are guesses that should
    # give enough passages: check `python scripts/run_all.py --profile paper --dry-run`, it prints how many questions
    # each method can actually produce. Evaluation uses a sample (evaluation.sample_per_file) because every question
    # costs about 36 LLM calls over the six conditions; set it to null to evaluate every question.
    corpora:
      lightrag: {max_docs: 30}
      raptor: {max_docs: 40}
      medrag: {max_textbooks: 6}
    benchmark:
      output_dir: results/benchmarks_paper
      size: {mode: count, count: 10000}
      max_questions_per_passage: 6
      max_attempts_factor: 4
      temperature: 0.7
      concurrency: 16
    mutation:
      output_dir: results/mutations_paper
      userinfo:                      # patient-profile premises (README 13.13) are part of the medical paper
        correct_operators: {patient_consistent: 1.0}
        incorrect_operators: {patient_conflict: 1.0}
      concurrency: 16
    evaluation:
      output_dir: results/eval_paper
      sample_per_file: 1000
    analysis:
      output_dir: results/analysis_paper
    benchdb:
      dir: results/benchdb_paper
    paper:
      output_dir: results/paper_final

  pilot:
    # A small trial in folders of its own (so it never mixes with your other runs, and an old result can never end up in
    # its report). Same corpus and index as the default profile. Use: bash run_paper.sh --pilot --n 10
    benchmark:
      output_dir: results/benchmarks_pilot
    mutation:
      output_dir: results/mutations_pilot
      userinfo:                      # patient-profile premises (README 13.13) are part of the medical paper
        correct_operators: {patient_consistent: 1.0}
        incorrect_operators: {patient_conflict: 1.0}
    evaluation:
      output_dir: results/eval_pilot
      sample_per_file: null
    analysis:
      output_dir: results/analysis_pilot
    benchdb:
      dir: results/benchdb_pilot
    paper:
      output_dir: results/paper_pilot
