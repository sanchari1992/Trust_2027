# One place for every setting. Change things here, not in the code.
# The corpora: settings pick the data folders automatically (a different subset or size gets
# its own folder). Settings that change how an INDEX is built (embedding model, chunk sizes,
# ...) do NOT: after changing one, delete that RAG's folder in indexes/ so it is rebuilt.
# README.md (section 4.9) lists exactly which settings need what.

llm:
  # Current model name per DeepSeek's changelog (2026-09-10).
  model: deepseek-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  thinking: disabled
  temperature: 0.0

embedding:
  # DeepSeek has no embedding API, so embeddings run locally.
  # Used by LightRAG and RAPTOR. (MedRAG uses its own medical retriever, MedCPT.)
  model: BAAI/bge-small-en-v1.5

corpora:
  lightrag:
    subset: mix          # UltraDomain subset: mix | agriculture | cs | legal (the four used in the LightRAG paper)
    max_docs: 10         # null = use every document (slow and costly on the big subsets)
  raptor:
    split: dev           # QuALITY split: dev | train
    max_docs: 10         # null = all
  medrag:
    max_textbooks: 3     # how many of the 18 MedRAG textbooks to use; null = all 18

lightrag:
  query_mode: hybrid
  # Smaller than LightRAG's default 1200 so chunks fit the embedding model's
  # 512-token window. A deviation from the paper's setup: disclose it.
  chunk_token_size: 400
  chunk_overlap_token_size: 50

raptor:
  repo_dir: third_party/raptor   # RAPTOR's own code, cloned by prepare_corpora.py
  chunk_tokens: 100              # RAPTOR default
  num_layers: 5                  # RAPTOR default
  summary_tokens: 100            # RAPTOR default
  top_k: 10                      # RAPTOR default
  max_context_tokens: 3500       # RAPTOR default

medrag:
  top_k: 32                      # MedRAG's default number of retrieved snippets
  batch_size: 32                 # snippets embedded at a time when building the index

# Question used by scripts/test_rag.py (you can also pass your own with --question)
tests:
  lightrag: "What are the main topics covered in these documents?"
  raptor: "What happens in the first story?"
  medrag: "What is the function of the phrenic nerve?"

# ------------------------------------------------------------------------
# Benchmark generation (RAGAS / ARES / DataMorgana). Every knob is here.
# ------------------------------------------------------------------------
benchmark:
  seed: 42                        # same seed + same settings = same passages picked
  output_dir: results/benchmarks

  # HOW MANY questions. Two ways to say it:
  #   mode: ratio  -> questions_per_1k_words x (corpus size in words / 1000), kept between min and max
  #   mode: count  -> exactly `count` questions
  size:
    mode: ratio
    questions_per_1k_words: 2.0
    count: 100
    min_questions: 20
    max_questions: 300

  # Size of the text unit a question is generated from, per method (in words).
  # Defaults are guesses from the papers: RAGAS used Wikipedia intro sections, ARES used short
  # KILT-style passages, DataMorgana used whole documents (here capped to one passage).
  passage_words:
    ragas: 250
    ares: 100
    datamorgana: 300
  min_passage_words: 40           # drops tiny leftover fragments at the end of a document

  sampling: spread                # spread = take turns between documents | random | sequential
  max_questions_per_passage: 1    # 1 = every question comes from a different passage
  max_attempts_factor: 3          # give up after target x this many attempts (filters reject some)
  concurrency: 8                  # LLM calls in parallel (lower it if DeepSeek rate-limits you)
  temperature: 0.0                # 0 = repeatable; raise for more varied questions
  dedupe_threshold: 0.9           # drop a question whose meaning is this close (cosine) to an earlier one; null = off
  drop_context_references: true   # drop questions saying "in the passage / given context" (not in the papers)

  ragas: {}                       # the RAGAs paper's question prompt has no settings

  ares:
    fewshot:                      # in-domain examples; replace with examples from YOUR corpus if you can
      lightrag: configs/ares_fewshot_general.json
      raptor: configs/ares_fewshot_general.json
      medrag: configs/ares_fewshot_medical.json
    n_fewshot: 5
    roundtrip_filter: true        # keep a query only if it retrieves its own passage
    roundtrip_top_k: 1            # the paper requires rank 1; raise to be more lenient
    negatives: false              # also make the paper's negatives for judge training (1 extra LLM call each)

  datamorgana:
    categorizations:              # who asks, and what kinds of questions (edit these JSON files freely)
      lightrag: configs/datamorgana_general.json
      raptor: configs/datamorgana_general.json
      medrag: configs/datamorgana_medical.json
    candidates_per_call: 3        # k in the paper
    filter: true                  # the paper's quality filter (1 extra LLM call per attempt)

# ------------------------------------------------------------------------
# Real user queries, for comparison with our generated benchmarks.
# ------------------------------------------------------------------------
real_queries:
  output_dir: data/real_queries
  spacy_model: en_core_web_sm       # small + fast; en_core_web_trf is more accurate but much slower

  general:
    # First user turn only, from two large real-world chat logs. Both need a
    # Hugging Face account that has requested and been granted access on the
    # dataset's page, and a token in .env as HF_TOKEN (see README section 10).
    sources: [wildchat, lmsyschat]
    n_per_source: 2000     # how many conversations to sample from EACH source
    languages: [en]        # keep only these detected/declared languages; null = keep all
    min_words: 3           # drop near-empty turns ("hi", "ok")
    max_words: 200         # drop unusually long pastes (code dumps, whole documents)
    seed: 42

  medical:
    # HealthChat-11K: the flagged health-seeking turn from each conversation,
    # pulled from the same two source datasets using HealthChat's own annotation file.
    n: 2000                 # null = use all ~11,000
    min_words: 3
    max_words: 200
    seed: 42

# ------------------------------------------------------------------------
# Comparing question sets (real queries vs. generated benchmarks).
# ------------------------------------------------------------------------
analysis:
  output_dir: results/analysis
  classifier_test_size: 0.3   # fraction of each set held out to test the real-vs-generated classifier
  classifier_cv_folds: 5      # cross-validation folds on the training part (reported alongside the held-out score)
  seed: 42
  bootstrap_samples: 2000     # for confidence intervals on each feature's difference
